<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAP PKS Dashboard - Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c00 100%);
            color: white;
            width: 250px;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .logo h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .logo p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 10px;
        }

        .nav-menu a {
            display: block;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-menu a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .nav-menu .icon {
            margin-right: 10px;
            font-size: 1.1em;
        }

        .content-area {
            flex: 1;
            display: flex;
        }

        .iframe-container {
            flex: 1;
            height: 100vh;
            border: none;
        }

        /* Hide sidebar in iframe content */
        iframe {
            width: 100%;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .iframe-container {
                height: calc(100vh - 200px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="logo">
                <h1>SPAP PKS</h1>
                <p>Sistem Pelayanan & Advokasi Publik</p>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#" onclick="loadPage('spap-dashboard.html'); return false;">
                        <span class="icon">📊</span>Dashboard</a></li>
                    <li><a href="#" onclick="loadPage('spap-aspirasi.html'); return false;">
                        <span class="icon">💬</span>Aspirasi Masyarakat</a></li>
                    <li><a href="#" onclick="loadPage('spap-pengaduan.html'); return false;">
                        <span class="icon">📝</span>Pengaduan</a></li>
                    <li><a href="#" onclick="loadPage('spap-osint.html'); return false;">
                        <span class="icon">🔍</span>OSINT Monitoring</a></li>
                    <li><a href="#" onclick="loadPage('spap-analytics.html'); return false;">
                        <span class="icon">📈</span>Analytics</a></li>
                    <li><a href="#" onclick="loadPage('spap-reports.html'); return false;">
                        <span class="icon">📋</span>Laporan</a></li>
                    <li><a href="#" onclick="loadPage('spap-settings.html'); return false;">
                        <span class="icon">⚙️</span>Pengaturan</a></li>
                </ul>
            </nav>
        </div>

        <!-- Content Area with iframe -->
        <div class="content-area">
            <iframe id="contentFrame" class="iframe-container" src="spap-dashboard.html"></iframe>
        </div>
    </div>

    <style>
        /* Additional CSS to inject into iframe */
        .injectCSS {
            display: none;
        }
    </style>

    <script>
        function loadPage(page) {
            const frame = document.getElementById('contentFrame');
            frame.src = page;
            
            // Inject CSS to hide sidebar in iframe after load
            frame.onload = function() {
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow.document;
                    const style = frameDoc.createElement('style');
                    style.textContent = '.sidebar { display: none !important; } .dashboard-container { grid-template-columns: 1fr !important; } .main-content { margin-left: 0 !important; padding: 20px; }';
                    frameDoc.head.appendChild(style);
                } catch (e) {
                    // Cross-origin restriction - CSS injection will work if files are local
                    console.log('Cannot inject CSS due to cross-origin restriction');
                }
            };
        }

        // Load dashboard by default
        loadPage('spap-dashboard.html');
    </script>
</body>
</html>
