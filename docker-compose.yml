services:
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    platform: linux/amd64
    build:
      context: ./php-backend
    environment:
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://spap:spap_password@postgres:5432/spap
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    platform: linux/amd64
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spap
      POSTGRES_USER: spap
      POSTGRES_PASSWORD: spap_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spap -d spap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    platform: linux/amd64
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    platform: linux/amd64
    image: mysql:8.4
    profiles:
      - mysql
    environment:
      MYSQL_DATABASE: spap
      MYSQL_USER: spap
      MYSQL_PASSWORD: spap_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "spap", "-pspap_password"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mysql_data:
